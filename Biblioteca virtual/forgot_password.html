<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/forgot_password.css" />
  </head>
  <body>
    <section class="nav-bar">
      <div class="logo">
        <img
          src="http://181.211.10.246/pluginfile.php/1/theme_klass/logo/1701456290/LogoSucreUniversitarioM.png"
          alt="ISU-SUCRE"
        />
      </div>
    </section>
    <section class="container-title">
      <div class="title">
        <h1>SUCRE Instituto Superior Universitario</h1>
      </div>
    </section>
    <section class="container">
      <div class="container-logo">
        <img
          src="http://181.211.10.246/pluginfile.php/1/core_admin/logo/0x200/1701456290/LOGO_ISU_SUCRE_SPET_NUEVO_2023.png"
          alt="SUCRE Instituto Superior Universitario"
          title="SUCRE Instituto Superior Universitario"
        />
      </div>
      <div class="container-email">
        <div class="message">
          <h2>Recuperación de contraseña</h2>
          <p>
            Ingrese su nombre de usuario o su correo electrónico. En caso de
            constar en los registros se le enviara un email con las
            instrucciones para recuperar su contraseña
          </p>
        </div>
        <div class="form">
          <div class="form-1">
            <form action="" method="post">
              <div class="user">
                <input
                  type="text"
                  name="user"
                  placeholder="Nombre de usuario"
                />
              </div>
              <button>Enviar</button>
            </form>
          </div>
          <div class="form-2">
            <form action="" method="post">
              <div class="email">
                <input
                  type="email"
                  name="email"
                  placeholder="Correo electrónico"
                />
              </div>
              <button>Enviar</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
